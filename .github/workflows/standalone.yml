name: Standalone behavior tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: test/standalone/Gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rspec test/standalone
